name: Dependency review
description: Dependency review

inputs:
  severity:
    description: severity
    required: false
    default: 'critical'

runs:
  using: composite
  steps:
    - name: Dependency Review
      uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
      with:
        fail-on-severity: ${{ inputs.severity }}
