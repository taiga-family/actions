name: Setup npm
description: Setup npm authentication via token or npm trusted publishing (OIDC)

inputs:
  token:
    description: NPM token. Omit it to publish via npm trusted publishing (OIDC)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup npm token
      if: ${{ inputs.token != '' }}
      shell: bash
      run: |
        npm config set '//registry.npmjs.org/:_authToken' "${{ inputs.token }}"

        if ! NPM_WHOAMI_OUTPUT=$(npm whoami 2>&1); then
          echo -e "Token is invalid or expired: ${NPM_WHOAMI_OUTPUT}"
          exit 1
        fi

        echo "npm whoami: ${NPM_WHOAMI_OUTPUT}"

    - name: Setup npm trusted publishing
      if: ${{ inputs.token == '' }}
      shell: bash
      run: |
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]]; then
          echo "::error::OIDC token is not available. Add 'permissions: id-token: write' to the job or pass a 'token' input"
          exit 1
        fi

        # npm trusted publishing requires npm >= 11.5.1
        if ! node -e '
          const [major, minor, patch] = process.argv[1].split(".").map(Number);
          process.exit(major * 1e6 + minor * 1e3 + patch >= 11005001 ? 0 : 1);
        ' "$(npm -v)"; then
          echo "npm $(npm -v) does not support trusted publishing, installing npm@^11.5.1"
          npm install --global npm@^11.5.1
        fi

        echo "npm $(npm -v): trusted publishing via OIDC"
